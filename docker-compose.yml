name: consultflow

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consultflow
      POSTGRES_PASSWORD: consultflow
      POSTGRES_DB: consultflow
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consultflow -d consultflow"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://consultflow:consultflow@db:5432/consultflow
      # Passed through only if set in your shell; offline provider works without them.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "127.0.0.1:18410:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
